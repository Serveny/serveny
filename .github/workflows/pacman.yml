name: Generate bomberman animation

on:
  schedule:
    - cron: "0 23 * * 6"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup pnpm
        uses: pnpm/action-setup@v4

      - name: install
        run: pnpm install

      - name: build
        run: pnpm run build-action

      - name: generate contribution graph SVGs
        uses: ./
        with:
          github_user_name: ${{ github.repository_owner }}
          games: bomberman

      - name: push bomberman-contribution-graph.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
